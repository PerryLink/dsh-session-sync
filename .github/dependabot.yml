version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Major upgrades are reviewed by hand; security updates are separate.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # zod stays on the host's 4.4.3: 4.6.x duplicates the ZodType identity
      # used by @deepseek-ai/schemastery and breaks `tsc`.
      - dependency-name: "zod"
      # Dependabot cannot produce a lockfile change for this peer: it resolves
      # 3.18.5-alpha.1 to 3.18.5 and then reports NoChangeError (dynamic run
      # 40108372183, 2026-10-24). Keep it out of the updater until fixed.
      - dependency-name: "@deepseek-ai/schemastery"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

# Nearest-workspace root for this standalone plugin package. This file makes
# pnpm treat dsh-session-sync as an independent workspace when the repository
# is checked out inside another pnpm workspace, such as a deepseek-harness
# checkout (which is where this repo lives during development).
packages:
  - .
# Force one copy of the bare peer edges. `@deepseek-ai/cordis`,
# `@deepseek-ai/cosmokit` and `@deepseek-ai/schemastery` reach this package as
# transitive peers (cordis → cosmokit; schemastery → cosmokit), so without an
# override pnpm can hoist a second version and the type graph forks. `cordis`
# must be 4.0.3: 4.0.2 does not export `Volatile`, and
# `@deepseek-ai/dsh-session-format-v3-to-v4` peer-requires `^4.0.3`.
# The self-referential entry keeps any dependency on this package resolving to
# the workspace copy instead of a second published one.
overrides:
  '@deepseek-ai/cordis': ^4.0.3
  '@deepseek-ai/cosmokit': ^1.8.4
  '@deepseek-ai/schemastery': ^3.18.3
  dsh-session-sync: link:.
minimumReleaseAgeExclude:
  - '@deepseek-ai/*'
# pnpm 11 enables minimumReleaseAge (1440 minutes) by default. The exclusion
# list above is only consulted while resolving: pnpm 11.7.0's frozen-install
# lockfile supply-chain verification pass ignores minimumReleaseAgeExclude
# (both exact `pkg@version` entries and `@scope/*` patterns), so a freshly
# published @deepseek-ai wave keeps `pnpm install --frozen-lockfile` red with
# ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION for 24h after every harness release.
# The sibling PerryLink plugins disable the age gate for the same reason; the
# exclusion list above stays as the documented intent.
minimumReleaseAge: 0
verifyDepsBeforeRun: false

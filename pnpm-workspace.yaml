# Nearest-workspace root for this standalone plugin package. This file makes
# pnpm treat dsh-session-sync as an independent workspace when the repository
# is checked out inside another pnpm workspace, such as a deepseek-harness
# checkout (which is where this repo lives during development).
packages:
  - .
minimumReleaseAgeExclude:
  - '@deepseek-ai/cosmokit@1.8.3'
  - '@deepseek-ai/dsh-attachment@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-brand@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-commands@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-llm@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-session@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-storage-domain@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-storage-json@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-storage@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-subprocess@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-system-prompt@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-timeout@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-tools@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-typert-protocol@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-user-approval@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-user-questions@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-util-crypto@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-util-values@0.1.2-alpha.5'
  - '@deepseek-ai/schemastery@3.18.2'
  - '@deepseek-ai/dsh-attachment@0.1.5-alpha.1'
  - '@deepseek-ai/dsh-brand@0.1.5-alpha.1'
  - '@deepseek-ai/dsh-commands@0.1.5-alpha.1'
  - '@deepseek-ai/dsh-http-proxy@0.1.5-alpha.1'
  - '@deepseek-ai/dsh-llm@0.1.5-alpha.1'
  - '@deepseek-ai/dsh-session@0.1.5-alpha.1'
  - '@deepseek-ai/dsh-storage-domain@0.1.5-alpha.1'
  - '@deepseek-ai/dsh-storage-json@0.1.5-alpha.1'
  - '@deepseek-ai/dsh-storage@0.1.5-alpha.1'
  - '@deepseek-ai/dsh-subprocess@0.1.5-alpha.1'
  - '@deepseek-ai/dsh-system-prompt@0.1.5-alpha.1'
  - '@deepseek-ai/dsh-timeout@0.1.5-alpha.1'
  - '@deepseek-ai/dsh-tools@0.1.5-alpha.1'
  - '@deepseek-ai/dsh-typert-protocol@0.1.5-alpha.1'
  - '@deepseek-ai/dsh-user-approval@0.1.5-alpha.1'
  - '@deepseek-ai/dsh-user-questions@0.1.5-alpha.1'
  - '@deepseek-ai/dsh-util-crypto@0.1.5-alpha.1'
  - '@deepseek-ai/dsh-util-values@0.1.5-alpha.1'
# pnpm 11 enables minimumReleaseAge (1440 minutes) by default. The exclusion
# list above is only consulted while resolving: pnpm 11.7.0's frozen-install
# lockfile supply-chain verification pass ignores minimumReleaseAgeExclude
# (both exact `pkg@version` entries and `@scope/*` patterns), so a freshly
# published @deepseek-ai wave keeps `pnpm install --frozen-lockfile` red with
# ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION for 24h after every harness release.
# The sibling PerryLink plugins disable the age gate for the same reason; the
# exclusion list above stays as the documented intent.
minimumReleaseAge: 0
verifyDepsBeforeRun: false
